name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Resolve dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod tidy; then
              exit 0
            fi
            echo "go mod tidy failed (attempt $attempt/3), retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Test
        run: go test ./...

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o dist/appguard.exe ./cmd/appguard

      - name: Copy example config and scripts
        run: |
          cp appguard.example.json dist/appguard.example.json
          cp appguard.controller.example.json dist/appguard.controller.example.json
          cp -r scripts dist/scripts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appguard-windows-amd64
          path: dist/
          if-no-files-found: error
