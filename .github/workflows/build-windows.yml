name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o dist/appguard.exe ./cmd/appguard

      - name: Copy example config and scripts
        run: |
          cp appguard.example.json dist/appguard.example.json
          cp -r scripts dist/scripts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appguard-windows-amd64
          path: dist/
          if-no-files-found: error
